[package]
name = "render_network"
version = "0.1.0"
description = "Created with Anchor for RNDR SPL token deposit/withdraw"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "render_network"
[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1" }

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# 👇 Critical: enable idl-build for BOTH crates
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[toolchain]
package_manager = "yarn"